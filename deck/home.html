<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SlideDeck · Presentations</title>
    <link rel="icon" href="/deck/favicon.ico" sizes="any" />
    <link rel="icon" href="/deck/favicon.svg" type="image/svg+xml" />
    <script>
      // Dark interface before the first paint (the setting itself lives in deck/ui.js).
      try {
        const ui = JSON.parse(localStorage.getItem("deck-settings") || "{}").ui || "system";
        const dark = ui === "dark" || (ui === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.ui = dark ? "dark" : "light";
      } catch {}
    </script>
    <link rel="stylesheet" href="/deck/home.css" />
    <link rel="stylesheet" href="/deck/welcome.css" />
    <!-- Bibliography view: formulas in titles (KaTeX) and the slides' serif for the references. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
    <script type="importmap">
      { "imports": { "katex": "https://cdn.jsdelivr.net/npm/katex@0.16.11/+esm" } }
    </script>
  </head>
  <body>
    <aside class="hm-side">
      <div class="hm-brand">
        <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <rect x="3" y="6" width="26" height="17" rx="3" class="hm-logo-frame" />
          <circle cx="11" cy="13.75" r="2.6" class="hm-logo-a" />
          <circle cx="21" cy="11.25" r="2.6" class="hm-logo-b" />
          <circle cx="19" cy="17.75" r="2.6" class="hm-logo-c" />
          <path d="M11 13.75 21 11.25M11 13.75l8 4M21 11.25l-2 6.5" class="hm-logo-edge" />
          <path d="M16 23v4M11 27h10" class="hm-logo-frame" />
        </svg>
        SlideDeck
      </div>
      <button class="hm-primary hm-new" data-action="new">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" /></svg>
        <span data-i18n="home.new">New presentation</span>
      </button>
      <nav class="hm-views"></nav>
      <h3>Tags</h3>
      <nav class="hm-tags"></nav>
      <div class="hm-foot-actions">
        <button class="hm-round hm-help" data-action="help" title="Help and guided tour" data-i18n-title="home.help" aria-label="Help and guided tour" data-i18n-aria-label="home.help">?</button>
        <button class="hm-round hm-theme-toggle" data-action="theme" title="Light or dark interface" data-i18n-title="home.themeToggle" aria-label="Light or dark interface" data-i18n-aria-label="home.themeToggle"><svg class="hm-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="hm-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button class="hm-round hm-settings" data-action="settings" title="Options" data-i18n-title="home.settings" aria-label="Options" data-i18n-aria-label="home.settings"><svg viewBox="0 0 24 24" width="19" height="19"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></button>
      </div>
    </aside>

    <main class="hm-main">
      <header class="hm-bar">
        <label class="hm-search">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" /><path d="m20 20-4-4" /></svg>
          <input type="search" placeholder="Search a presentation, a tag…" data-i18n-placeholder="home.search" spellcheck="false" />
          <kbd>/</kbd>
        </label>
        <select class="hm-sort" aria-label="Sort" data-i18n-aria-label="home.sort">
          <option value="modified" data-i18n="home.sortModified">Recently modified</option>
          <option value="title" data-i18n="home.sortTitle">Title</option>
          <option value="year" data-i18n="home.sortYear">Year</option>
        </select>
        <div class="hm-segment" role="group" aria-label="Layout" data-i18n-aria-label="home.layout">
          <button data-layout="grid" title="Grid" data-i18n-title="home.grid"><svg viewBox="0 0 24 24" width="18" height="18"><rect x="4" y="4" width="7" height="7" rx="1.5" /><rect x="13" y="4" width="7" height="7" rx="1.5" /><rect x="4" y="13" width="7" height="7" rx="1.5" /><rect x="13" y="13" width="7" height="7" rx="1.5" /></svg></button>
          <button data-layout="list" title="List" data-i18n-title="home.list"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" /></svg></button>
        </div>
      </header>
      <h1 class="hm-title"></h1>
      <section class="hm-cards"></section>
      <p class="hm-empty" hidden></p>
      <section class="hm-bib" hidden></section>
    </main>

    <div class="hm-menu" hidden></div>

    <div class="hm-modal hm-create" hidden>
      <form class="hm-dialog hm-dialog-wide">
        <h2 data-i18n="home.new">New presentation</h2>
        <label><span data-i18n="home.fieldTitle">Title</span><input name="title" required placeholder="Pooling on graphs" data-i18n-placeholder="home.titlePlaceholder" autocomplete="off" /></label>
        <div class="hm-fields">
          <label><span data-i18n="home.folder">Folder</span><input name="name" required pattern="[a-z0-9][a-z0-9_]*" placeholder="pooling_on_graphs" data-i18n-placeholder="home.folderPlaceholder" autocomplete="off" /></label>
          <label><span data-i18n="home.sortYear">Year</span><input name="year" required pattern="\d{4}" autocomplete="off" /></label>
        </div>
        <label><span data-i18n="home.author">Author</span><input name="author" placeholder="Ada Lovelace" autocomplete="name" /></label>
        <div class="hm-field">
          <span data-i18n="home.template">Template</span>
          <div class="hm-themes" role="radiogroup"></div>
        </div>
        <input type="hidden" name="theme" value="paper" />
        <p class="hm-path"></p>
        <p class="hm-error"></p>
        <div class="hm-actions">
          <button type="button" data-action="cancel" data-i18n="home.cancel">Cancel</button>
          <button type="submit" class="hm-primary" data-i18n="home.create">Create and open</button>
        </div>
      </form>
    </div>

    <div class="hm-modal hm-edit" hidden>
      <form class="hm-dialog">
        <h2 data-i18n="home.details">Details</h2>
        <label><span data-i18n="home.fieldTitle">Title</span><input name="title" required autocomplete="off" /></label>
        <label><span data-i18n="home.description">Description</span><textarea name="description" rows="3" maxlength="400" placeholder="Audience, goal, length…" data-i18n-placeholder="home.descriptionPlaceholder"></textarea></label>
        <div class="hm-fields hm-fields-even">
          <label><span data-i18n="home.date">Date of the talk</span><input name="date" type="date" /></label>
          <label><span data-i18n="home.venue">Venue or event</span><input name="venue" maxlength="120" placeholder="ML seminar, Paris" data-i18n-placeholder="home.venuePlaceholder" autocomplete="off" /></label>
        </div>
        <p class="hm-error"></p>
        <div class="hm-actions">
          <button type="button" data-action="cancel" data-i18n="home.cancel">Cancel</button>
          <button type="submit" class="hm-primary" data-i18n="home.save">Save</button>
        </div>
      </form>
    </div>

    <div class="hm-modal hm-delete" hidden>
      <form class="hm-dialog">
        <h2 data-i18n="home.deleteTitle">Delete this presentation?</h2>
        <p class="hm-delete-name"></p>
        <p class="hm-warning" data-i18n="home.deleteWarning">Its whole folder (slides, images, notes, feedback) will be removed from the disk. This cannot be undone.</p>
        <p class="hm-error"></p>
        <div class="hm-actions">
          <button type="button" data-action="cancel" data-i18n="home.cancel">Cancel</button>
          <button type="submit" class="hm-primary hm-danger" data-i18n="home.deleteConfirm">Delete permanently</button>
        </div>
      </form>
    </div>

    <div class="hm-modal hm-bibedit" hidden>
      <form class="hm-dialog hm-dialog-wide">
        <h2 data-i18n="bib.editTitle">Edit the reference</h2>
        <label><span>BibTeX</span><textarea name="bibtex" rows="14" spellcheck="false" class="hm-code"></textarea></label>
        <label class="hm-check" hidden><input type="checkbox" name="rename" checked /><span></span></label>
        <p class="hm-error"></p>
        <div class="hm-actions">
          <button type="button" data-action="cancel" data-i18n="home.cancel">Cancel</button>
          <button type="submit" class="hm-primary" data-i18n="home.save">Save</button>
        </div>
      </form>
    </div>

    <div class="hm-modal hm-bibdelete" hidden>
      <form class="hm-dialog">
        <h2 data-i18n="bib.deleteTitle">Delete this reference?</h2>
        <p class="hm-bibdelete-ref"></p>
        <p class="hm-warning"></p>
        <p class="hm-error"></p>
        <div class="hm-actions">
          <button type="button" data-action="cancel" data-i18n="home.cancel">Cancel</button>
          <button type="submit" class="hm-primary hm-danger" data-i18n="bib.deleteConfirm">Delete</button>
        </div>
      </form>
    </div>

    <div class="hm-toast" hidden></div>
    <script type="module" src="/deck/home.js"></script>
  </body>
</html>
