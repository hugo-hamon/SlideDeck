<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pooling sur graphes</title>
    <link rel="icon" href="/deck/favicon.ico" sizes="any" />
    <link rel="icon" href="/deck/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="stylesheet" href="/deck/theme.css" />
    <script type="importmap">
      {
        "imports": {
          "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm",
          "katex": "https://cdn.jsdelivr.net/npm/katex@0.16.11/+esm",
          "deck/": "/deck/"
        }
      }
    </script>
  </head>
  <body>
    <main class="stage"></main>
    <script type="module">
      import { section, startDeck } from "deck/deck.js";
      import intro from "./pages/intro.js";
      import example from "./pages/example.js";
      import plan, { recap, where } from "./pages/plan.js";
      import thesis from "./pages/thesis.js";
      import motivation from "./pages/motivation.js";
      import mpnn from "./pages/mpnn.js";
      import layer from "./pages/layer.js";
      import underreach from "./pages/underreach.js";
      import smoothing from "./pages/smoothing.js";
      import squashing from "./pages/squashing.js";
      import depth from "./pages/depth.js";
      import src from "./pages/src.js";
      import taxonomy from "./pages/taxonomy.js";
      import topk from "./pages/topk.js";
      import diffpool from "./pages/diffpool.js";
      import mincut from "./pages/mincut.js";
      import mivs from "./pages/mivs.js";

      await document.fonts.load("44px 'EB Garamond'");
      // The part context only appears in the footer from the outline onwards.
      const slides = [
        intro,
        example,
        ...[plan, thesis, motivation].map((slide) => section(slide, where())),
        ...[recap(0), mpnn, layer].map((slide) => section(slide, where(0))),
        ...[recap(1), underreach, smoothing, squashing, depth].map((slide) => section(slide, where(1))),
        ...[recap(2), src, taxonomy].map((slide) => section(slide, where(2))),
        ...[recap(3), topk, diffpool, mincut, mivs].map((slide) => section(slide, where(3))),
      ];
      startDeck(slides, { footer: ["MLG", "Hugo Hamon", "18/10/2026"] });
    </script>
  </body>
</html>
